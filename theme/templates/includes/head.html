    <meta name="generator" content="Pelican" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block description %}Since 2012 English Comedy Brussels is the town’s #1 for English speaking stand-up comedy as well as being one of the best clubs in Europe.{% endblock %}" />
    <title>{% block title %}{{ SITENAME }}{% endblock %}</title>

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="{% block og_type %}website{% endblock %}" />
    <meta property="og:site_name" content="{{ SITENAME }}" />
    <meta property="og:title" content="{% block og_title %}{{ SITENAME }}{% endblock %}" />
    <meta property="og:description" content="{% block og_description %}Since 2012 English Comedy Brussels is the town’s #1 for English speaking stand-up comedy.{% endblock %}" />
    {% block og_image %}<meta property="og:image" content="{{ SITEURL }}/theme/images/logo.png" />{% endblock %}
    {% block og_url %}{% endblock %}

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{% block twitter_title %}{{ SITENAME }}{% endblock %}" />
    <meta name="twitter:description" content="{% block twitter_description %}Since 2012 English Comedy Brussels is the town’s #1 for English speaking stand-up comedy.{% endblock %}" />
    {% block twitter_image %}<meta name="twitter:image" content="{{ SITEURL }}/theme/images/logo.png" />{% endblock %}

    <link href='https://fonts.googleapis.com/css?family=Montserrat:400,700' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/main.css">
    <!-- past events accordion -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
      var toggler = document.querySelector('h2.past_events_toggler');
      var table = document.querySelector('table.past_events');
      if (toggler && table) {
        table.style.display = 'none';
        toggler.addEventListener('click', function() {
          table.style.display = (table.style.display === 'none') ? 'table' : 'none';
        });
      }
    });
    </script>
